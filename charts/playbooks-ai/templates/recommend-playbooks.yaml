{{- if .Values.diagnose.playbooksRecommender.enabled }}
apiVersion: mission-control.flanksource.com/v1
kind: Playbook
metadata:
  name: recommend-playbook
spec:
  title: Recommend Playbooks
  description: Diagnoses the health of a resource using AI, and then recommends playbooks to fix the issue, sending the results to Slack
  icon: bot
  category: AI
  configs:
    {{- with .Values.diagnose.selector }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  parameters:
    - name: prompt
      label: Prompt
      default: Find out why $(.config.name) is unhealthy
      properties:
        multiline: 'true'
  actions:
    - name: analyse
      ai:
        formats:
          - recommendPlaybook
        recommendPlaybooks:
          {{- with .Values.diagnose.playbooksRecommender.selector }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        connection: '{{.Values.global.llm_connection}}'
        systemPrompt: '{{.Values.diagnose.systemPrompt}}'
        {{- with .Values.diagnose.playbooksRecommender.playbooks }}
        playbooks:
          {{- tpl (toYaml .) $ | nindent 10 }}
        {{- end }}
        prompt: '$(.params.prompt)'
        changes:
          since: {{.Values.diagnose.timeframe.changes}}
        analysis:
          since: {{.Values.diagnose.timeframe.analysis}}
        relationships:
          - depth: 3
            direction: outgoing
            changes:
              since: {{.Values.diagnose.timeframe.relatedChanges}}
            analysis:
              since: {{.Values.diagnose.timeframe.relatedAnalysis}}
          - depth: 5
            direction: incoming
            changes:
              since: {{.Values.diagnose.timeframe.relatedChanges}}
            analysis:
              since: {{.Values.diagnose.timeframe.relatedAnalysis}}
    - name: send recommended playbooks
      notification:
        connection: '{{.Values.slack.connection}}'
        title: Recommended playbooks
        message: '$(getLastAction.result.recommendedPlaybooks)'
---
apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: playbooks-ai-all-configs
spec:
  description: every config the AI playbook recommender may run on
  targets:
    - config:
        name: "*"
---
apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: playbooks-ai-recommend-playbook
spec:
  description: the AI playbook recommender playbook
  targets:
    - playbook:
        name: recommend-playbook
        namespace: {{.Release.Namespace}}
---
apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: playbooks-ai-kubernetes-logs-playbook
spec:
  description: the kubernetes logs playbook the AI playbook recommender runs for context
  targets:
    - playbook:
        name: kubernetes-logs
        namespace: {{.Release.Namespace}}
{{- $connectionTargets := include "connection-scope-targets" (list .Values.slack.connection .Values.global.llm_connection .Values.global.artifact_connection) | trim }}
{{- if $connectionTargets }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Scope
metadata:
  name: playbooks-ai-recommender-connections
spec:
  description: slack, llm & artifact connections used by the AI playbook recommender playbook
  targets:
    {{- $connectionTargets | nindent 4 }}
{{- end }}
---
apiVersion: mission-control.flanksource.com/v1
kind: Role
metadata:
  name: recommend-playbook
spec:
  rules:
    - name: read-configs
      action: read
      resource:
        scopeRef: playbooks-ai-all-configs
    - name: run-kubernetes-logs
      action: playbook:run
      resource:
        scopeRef: playbooks-ai-kubernetes-logs-playbook
      target:
        scopeRef: playbooks-ai-all-configs
    {{- if $connectionTargets }}
    - name: use-connections
      action: connection:use
      resource:
        scopeRef: playbooks-ai-recommender-connections
    {{- end }}
---
apiVersion: mission-control.flanksource.com/v1
kind: RoleBinding
metadata:
  name: recommend-playbook
spec:
  description: allow playbook "recommend-playbook" to use the slack, llm & artifact connections and run the kubernetes logs playbook
  role: recommend-playbook
  subjects:
    playbooks:
      - name: recommend-playbook
        namespace: {{.Release.Namespace}}
{{- end }}
