{{- if .Values.playbooks.reconcile }}
apiVersion: mission-control.flanksource.com/v1
kind: Playbook
metadata:
  name: flux-reconcile
spec:
  title: Reconcile
  icon: flux
  category: Flux
  description: Triggers a reconciliation of the selected Flux object
  configs:
    - types:
        - Kubernetes::HelmRelease
        - Kubernetes::Kustomization
        - Kubernetes::HelmRepository
        - Kubernetes::HelmChart

  parameters:
    - name: force
      label: Force
      type: checkbox
      description: Force a one-off Helm install or upgrade. Only supported for HelmReleases.
    - name: reset
      label: Reset
      type: checkbox
      description: Reset remediation retry counters. Only supported for HelmReleases.

  runsOn:
    -  {{` "{{- if .agent }}{{.agent.id}}{{ else }}local{{ end }}" `}}

  actions:
    - name: Reconcile
      exec:
        connections:
          fromConfigItem: '$(.config.id)'
        script: |
          TOKEN='$( time.Now.Format "2006-01-02T15:04:05.999999999Z07:00" )'
          FORCE=$(.params.force | default "false" | shellQuote)
          RESET=$(.params.reset | default "false" | shellQuote)
          set -- "reconcile.fluxcd.io/requestedAt=$TOKEN"

          if [ '$(.config.type)' = 'Kubernetes::HelmRelease' ]; then
            if [ "$FORCE" = 'true' ]; then
              set -- "$@" "reconcile.fluxcd.io/forceAt=$TOKEN"
            fi
            if [ "$RESET" = 'true' ]; then
              set -- "$@" "reconcile.fluxcd.io/resetAt=$TOKEN"
            fi
          elif [ "$FORCE" = 'true' ] || [ "$RESET" = 'true' ]; then
            echo 'Force and reset are only supported for HelmReleases.' >&2
            exit 1
          fi

          kubectl annotate -n $(.config.tags.namespace) $(.config.config_class | strings.ToLower) $(.config.name) "$@" --overwrite
{{- end}}
