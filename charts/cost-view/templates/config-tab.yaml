{{- if and .Values.views.enabled .Values.views.configTab.enabled }}
apiVersion: mission-control.flanksource.com/v1
kind: View
metadata:
  name: cost-config-tab
  labels:
    {{- include "cost-view.labels" . | nindent 4 }}
spec:
  description: Spend charged to a single config item, broken down by SKU.
  display:
    title: Cost
    icon: dollar
    plugins:
      - configTab:
          types:
            {{- range .Values.views.configTab.types }}
            - {{ . | quote }}
            {{- end }}
        variables:
          config_id: '$(.config.id)'
  {{- include "cost-view.cache" . | nindent 2 }}
  {{- include "cost-view.baseTemplating" . | nindent 2 }}
  panels:
    - name: Spend in window
      type: number
      number:
        precision: 2
      query: SELECT total AS value, label FROM totals

    - name: Savings vs list
      type: number
      number:
        unit: percent
        precision: 1
      query: SELECT savings_pct AS value FROM totals

    - name: Daily spend
      description: The final bucket is usually incomplete
      type: timeseries
      timeseries:
        timeKey: timestamp
        valueKey: value
        style: area
      query: SELECT day AS timestamp, SUM(effective) AS value FROM charges GROUP BY day ORDER BY day

    - name: Spend by SKU
      type: piechart
      piechart:
        showLabels: true
      query: SELECT sku, SUM(effective) AS count FROM charges GROUP BY sku ORDER BY count DESC
  columns:
    - name: sku
      type: string
      primaryKey: true
      card:
        position: title
    - name: service
      type: string
      card:
        position: subtitle
      filter:
        type: multiselect
    - name: charge_category
      type: string
      filter:
        type: multiselect
    - name: region
      type: string
      filter:
        type: multiselect
    - name: quantity
      type: decimal
    - name: unit
      type: string
    - name: effective
      type: decimal
      card:
        position: headerRight
    - name: list
      type: decimal
  merge: |
    SELECT sku, service, charge_category, region,
           SUM(quantity)  AS quantity,
           MAX(unit)      AS unit,
           SUM(effective) AS effective,
           SUM(list)      AS list
    FROM charges
    GROUP BY sku, service, charge_category, region
    ORDER BY effective DESC
  queries:
    charges:
      columns:
        day: string
        sku: string
        service: string
        charge_category: string
        region: string
        quantity: decimal
        unit: string
        effective: decimal
        list: decimal
      sql:
        connection: {{ .Values.connection | quote }}
        query: |
          WITH
          {{- include "cost-view.deduped" . | nindent 10 }}
          SELECT
            to_char(date_trunc('day', d.period_start AT TIME ZONE 'UTC'), 'YYYY-MM-DD') AS day,
            COALESCE(NULLIF(d.sku_id, ''), '(no sku)')                                  AS sku,
            COALESCE(NULLIF(d.service_name, ''), 'Unknown')                             AS service,
            d.charge_category                                                           AS charge_category,
            COALESCE(NULLIF(d.region_id, ''), '')                                       AS region,
            round(SUM(COALESCE(d.pricing_quantity, 0)), 4)::float8                      AS quantity,
            COALESCE(MAX(d.pricing_unit), '')                                           AS unit,
            round(SUM(d.effective_cost), 4)::float8                                     AS effective,
            round(SUM(COALESCE(d.list_cost, 0)), 4)::float8                             AS list
          FROM deduped d
          WHERE d.config_id = '$(.var.config_id)'
            AND d.billing_currency = '$(.var.currency)'
            AND d.period_start >= now() - INTERVAL '$(.var.window)'
          GROUP BY 1, 2, 3, 4, 5
          ORDER BY 1, 8 DESC
    totals:
      columns:
        total: decimal
        savings_pct: decimal
        label: string
      sql:
        connection: {{ .Values.connection | quote }}
        query: |
          WITH
          {{- include "cost-view.deduped" . | nindent 10 }}
          , t AS (
            SELECT COALESCE(SUM(effective_cost), 0) AS eff,
                   COALESCE(SUM(list_cost), 0)      AS list
            FROM deduped
            WHERE config_id = '$(.var.config_id)'
              AND billing_currency = '$(.var.currency)'
              AND period_start >= now() - INTERVAL '$(.var.window)'
          )
          SELECT
            round(eff, 2)::float8                                                 AS total,
            CASE WHEN list > 0
                 THEN round((list - eff) / list * 100, 1)::float8 END             AS savings_pct,
            'Spend in window ($(.var.currency))'                                  AS label
          FROM t
{{- end }}
